<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Now </title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>
   
   
    <!-- CABECERA: Contiene logo y menú -->
    <header class="header">
         <div class="logo">TravelNow ✈️</div>
            <nav class="navbar">
                <a href="#inicio">Inicio</a>
                 <a href="#destinos">Destinos</a>
                <a href="#contacto">Contacto</a>
            </nav>
             <!-- ¡NUEVO ELEMENTO! Botón para el modo oscuro -->
                <button id="btn-tema" class="btn-tema">🌙 Oscuro</button>  
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- SECCIÓN 1: Hero (La portada de impacto) -->
        <section id="inicio" class="hero">
            <div class="hero-content">
                <h1>Descubre el mundo con nosotros</h1>
                <p>Planificamos el viaje de tus sueños al mejor precio.</p>
                <button class="btn-primary">Reservar Ahora</button>
            </div> <!-- Se agregó la etiqueta de cierre que faltaba -->
        </section>
        <!-- SECCION 2: Servicios (Uso de Grid) -->
        <section id="destinos" class="servicios">
            <h2>Nuestros Servicios</h2>
            <div class="grid-servicios">
                <article class="card">
                    <img src="img/servicio-1.jpg" alt="Organización de equipaje">
                    <h3>Equipaje Seguro</h3>
                    <p>Viaja ligero y sin preocupaciones.</p>
                </article>

                <article class="card">
                    <img src="img/servicio-2.jpg" alt="Rutas personalizadas">
                    <h3>Rutas Únicas</h3>
                    <p>Mapas detallados para aventuras reales.</p>
                </article>

                <article class="card">
                    <img src="img/servicio-3.jpg" alt="Vuelos económicos">
                    <h3>Vuelos Económicos</h3>
                    <p>Conexiones a todo el mundo.</p>
                </article>
            </div>
        </section>
    
    </main>
    <script src="js/app.js" defer></script>
</body>

</html>
